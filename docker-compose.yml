name: bulgaria-auto-carmarket

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-use-a-long-random-value}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,capacitor://localhost,http://localhost,https://localhost}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carmarket}:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/${POSTGRES_DB:-carmarket}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-carmarket-minio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-password}
  S3_BUCKET: ${S3_BUCKET:-carmarket}
  S3_SECURE: ${S3_SECURE:-false}
  SCRAPE_USER_AGENT: "${SCRAPE_USER_AGENT:-BulgariaAutoCarMarket/1.0 (self-hosted; respectful crawler; contact: admin@example.invalid)}"
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
  SCRAPER_RETRY_LIMIT: ${SCRAPER_RETRY_LIMIT:-3}
  SCRAPER_BACKOFF_SECONDS: ${SCRAPER_BACKOFF_SECONDS:-2}
  IMAGE_DOWNLOAD_ENABLED: ${IMAGE_DOWNLOAD_ENABLED:-false}
  IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-8000000}
  IMAGE_MAX_PER_LISTING: ${IMAGE_MAX_PER_LISTING:-10}
  ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-false}
  ARCHIVE_MAX_BYTES: ${ARCHIVE_MAX_BYTES:-8000000}
  STALE_LISTING_DAYS: ${STALE_LISTING_DAYS:-14}
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_AUTO_ANALYZE: ${AI_AUTO_ANALYZE:-false}
  AI_ANALYZE_IMAGES: ${AI_ANALYZE_IMAGES:-false}
  AI_INCLUDE_DESCRIPTIONS: ${AI_INCLUDE_DESCRIPTIONS:-true}
  AI_DEFAULT_TASK: ${AI_DEFAULT_TASK:-best_deals}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
  AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-180}
  AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
  AI_CANDIDATE_LIMIT: ${AI_CANDIDATE_LIMIT:-40}

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-carmarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - carmarket

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - carmarket

  minio-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown 100:101 /data"]
    volumes:
      - minio_data:/data
    restart: "no"
    networks:
      - carmarket

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carmarket-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - carmarket

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks:
      - carmarket

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - carmarket

  scraper-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --queues=scrape
      - --concurrency=1
      - --hostname=scraper@%h
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d scraper@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    init: true
    networks:
      - carmarket

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    init: true
    networks:
      - carmarket

  ollama:
    image: ollama/ollama:0.40.6
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - carmarket

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    profiles: ["ai"]
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --queues=ai
      - --concurrency=${AI_MAX_CONCURRENCY:-1}
      - --hostname=ai@%h
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      backend:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d ai@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    init: true
    networks:
      - carmarket

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:

networks:
  carmarket:
    driver: bridge
